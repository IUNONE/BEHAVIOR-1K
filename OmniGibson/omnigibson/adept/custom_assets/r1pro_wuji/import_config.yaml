# Do not pass this file directly to import_custom_robot.py.
# Collision decomposition rewrites the URDF. Run import_usd(), which copies first.
# EEF and camera poses are initial values to tune after import.
urdf_path: urdf/r1pro_wuji.urdf
name: r1pro_wuji
headless: true
overwrite: true
merge_fixed_joints: false
dataset_name: omnigibson-robot-assets
base_motion:
  wheel_links:
  - wheel_motor_link1
  - wheel_motor_link2
  - wheel_motor_link3
  wheel_joints:
  - steer_motor_joint1
  - wheel_motor_joint1
  - steer_motor_joint2
  - wheel_motor_joint2
  - steer_motor_joint3
  - wheel_motor_joint3
  use_sphere_wheels: true
  use_holonomic_joints: true
collision:
  decompose_method: convex
  hull_count: 1
  coacd_links: []

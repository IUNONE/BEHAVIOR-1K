  - l_ring_finger_tip_sensor_frame
  - l_thumb_distal
  - l_thumb_middle
  - l_thumb_proximal
  - l_thumb_proximal_abd
  - l_thumb_tip_sensor_frame
  - l_wrist
  - left_arm_base_link
  - left_arm_link1

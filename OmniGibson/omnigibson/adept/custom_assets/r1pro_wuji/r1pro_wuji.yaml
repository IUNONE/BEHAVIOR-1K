# ADEPT R1Pro with Wuji Hand 2. This definition lives here, not in omnigibson-robot-assets.
# default_joint_pos has 64 values: 6 holonomic base joints (x, y, z, rx, ry, rz),
# then 4 torso, 7 left arm, 20 left hand, 7 right arm, 20 right hand.
# Steer and wheel joints are fixed during import and are not DOFs.
# Right mount yaw is 90 degrees. Left mount yaw is -90 degrees.
# assisted_grasp points are wrist placeholders so assisted mode does not read an empty default.
raw_controller_order:
- base
- trunk
- arm_left
- gripper_left
- arm_right
- gripper_right
default_controllers:
  base: HolonomicBaseJointController
  trunk: JointController
  arm_left: JointController
  arm_right: JointController
  gripper_left: MultiFingerGripperController
  gripper_right: MultiFingerGripperController

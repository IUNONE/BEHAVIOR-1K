frequencies:
  action_frequency: 30
  rendering_frequency: 30
  physics_frequency: 120
max_steps: 1800
settle_steps: 60
sampling_check_steps: 60
check_steps: 60
robot:
  position: [0.0, 0.0, 0.0]
  orientation: [0.0, 0.0, 0.0, 1.0]
camera:
  position: [1.7, -1.7, 1.8]
  target: [0.8, 0.0, 0.85]
  image_height: 480
  image_width: 480
  horizontal_aperture: 40.0
room_objects:
  - {type: PrimitiveObject, name: floor, primitive_type: Cube, scale: [4.0, 4.0, 0.1], position: [0.5, 0.0, -0.05], fixed_base: true, rgba: [0.65, 0.65, 0.65, 1.0]}
  - {type: PrimitiveObject, name: back_wall, primitive_type: Cube, scale: [0.1, 4.0, 2.5], position: [2.5, 0.0, 1.25], fixed_base: true}
  - {type: PrimitiveObject, name: front_wall, primitive_type: Cube, scale: [0.1, 4.0, 2.5], position: [-1.5, 0.0, 1.25], fixed_base: true}
  - {type: PrimitiveObject, name: left_wall, primitive_type: Cube, scale: [4.0, 0.1, 2.5], position: [0.5, 2.0, 1.25], fixed_base: true}
  - {type: PrimitiveObject, name: right_wall, primitive_type: Cube, scale: [4.0, 0.1, 2.5], position: [0.5, -2.0, 1.25], fixed_base: true}
table:
  type: DatasetObject
  name: work_table
  category: desk
  model: iotfzl
  bounding_box: [0.75, 1.25, 0.75]
  fixed_base: true
  position: [0.85, 0.0, 0.5]
  orientation: [0.0, 0.0, 0.0, 1.0]
thresholds:
  linear_speed: 0.02
  angular_speed: 0.1
  base_drift: 0.02
  initial_object_drift: 0.03
  sampling_table_margin: 0.01
  sampling_object_clearance: 0.02
  sampling_rotation_degrees: 5.0

instruction: Put the object on the tray and place the loaded tray on the target pad.
bindings:
  agent.n.01_1: robot
  table.n.02_1: work_table
  tray.n.01_1: tray
  plate.n.04_1: payload
  place_mat.n.01_1: target_pad
objects:
  - {type: DatasetObject, name: tray, category: tray, model: gsxbym, position: [0.8, 0.15, 1.0]}
  - {type: DatasetObject, name: payload, category: plate, model: xfjmld, position: [0.8, -0.3, 1.0]}
  - {type: PrimitiveObject, name: target_pad, category: place_mat, primitive_type: Cube, scale: [0.36, 0.50, 0.01], fixed_base: true, abilities: {}, rgba: [0.1, 0.6, 0.2, 1.0], position: [1.005, -0.31, 0.8]}
placements:
  target_pad: {xy: [1.005, -0.31], support: work_table, gap: 0.0, orientation: [0.0, 0.0, 0.0, 1.0]}
sampling:
  tray:
    xy_bounds: [[0.75, 0.23], [0.95, 0.34]]
    yaw_degrees: [-180.0, 180.0]
  payload:
    xy_bounds: [[0.64, -0.40], [0.66, -0.20]]
    yaw_degrees: [-180.0, 180.0]
initial_state:
  placements:
    tray: {support: work_table, orientation: [0.0, 0.0, 0.0, 1.0]}
    payload: {support: work_table, orientation: [0.0, 0.0, 0.0, 1.0]}
  parameters:
    condition: empty tray and payload on table outside the target pad
    manipulated_objects: [tray, payload]

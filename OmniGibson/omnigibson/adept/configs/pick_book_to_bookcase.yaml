instruction: Put the book into the tabletop bookcase.
bindings:
  agent.n.01_1: robot
  table.n.02_1: work_table
  book.n.02_1: book
  bookcase.n.01_1: bookcase
objects:
  - {type: DatasetObject, name: book, category: hardback, model: aceozs, position: [0.67, 0.0, 1.0]}
  - {type: DatasetObject, name: bookcase, category: bookcase, model: vndvrn, scale: 1.3, fixed_base: true, position: [0.99, 0.0, 1.0]}
placements:
  bookcase: {xy: [0.99, 0.0], support: work_table, gap: 0.0, orientation: [0.0, 0.0, 0.0, 1.0]}
sampling:
  book:
    xy_bounds: [[0.61, -0.27], [0.73, 0.27]]
    yaw_degrees: [-180.0, 180.0]
initial_state:
  placements:
    book: {support: work_table, orientation: [0.0, 0.0, 0.0, 1.0]}
  parameters:
    condition: book on table outside a fixed tabletop bookcase
    manipulated_objects: [book]

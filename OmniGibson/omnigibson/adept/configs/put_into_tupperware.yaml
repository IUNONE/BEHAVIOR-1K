instruction: Put the croissant into the tupperware container.
bindings:
  agent.n.01_1: robot
  table.n.02_1: work_table
  tupperware.n.01_1: tupperware
  crescent_roll.n.01_1: payload
objects:
  - {type: DatasetObject, name: tupperware, category: tupperware, model: mkstwr, position: [0.72, 0.15, 1.0]}
  - {type: DatasetObject, name: payload, category: croissant, model: xxsanu, position: [0.70, -0.18, 1.0]}
placements: {}
sampling:
  tupperware:
    xy_bounds: [[0.65, 0.13], [0.85, 0.26]]
    yaw_degrees: [-180.0, 180.0]
  payload:
    xy_bounds: [[0.59, -0.28], [0.85, -0.14]]
    yaw_degrees: [-180.0, 180.0]
initial_state:
  placements:
    tupperware: {support: work_table, orientation: [0.0, 0.0, 0.0, 1.0]}
    payload: {support: work_table, orientation: [0.0, 0.0, 0.0, 1.0]}
  parameters:
    condition: open tupperware on the table with a croissant outside the container
    manipulated_objects: [tupperware, payload]
